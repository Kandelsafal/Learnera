name: Full-Stack CI Workflow

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ==========================================
  # JOB 1: BACKEND (Django + PostgreSQL)
  # ==========================================
  backend-test:
    runs-on: ubuntu-latest

    # Spin up a real Postgres database for testing
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          # Adjust path if your requirements.txt is nested, e.g., backend/requirements.txt
          pip install -r backend/requirements.txt

      - name: Run Django Tests
        env:
          DEBUG: 'False'
          SECRET_KEY: 'ci-dummy-secret-key-for-testing-purposes-only'
          DB_NAME: 'test_db'
          DB_USER: 'postgres'
          DB_PASSWORD: 'postgrespassword'
          DB_HOST: 'localhost'
          DB_PORT: '5432'
        run: |
          # Change directory into your backend folder if needed
          cd backend
          python manage.py test

  # ==========================================
  # JOB 2: FRONTEND (Next.js)
  # ==========================================
  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          # If using yarn or pnpm, specify cache-dependency-path or use setup tool

      - name: Install frontend dependencies
        run: |
          cd frontend  # Change directory to where your Next.js project lives
          npm ci

      - name: Run Next.js Linter / Tests
        run: |
          cd frontend
          npm run lint
          # npm run test  # Uncomment if you have unit tests set up (Jest/Vitest)

      - name: Build Next.js Application
        env:
          NEXT_PUBLIC_API_URL: 'http://localhost:8000/api' # Dummy URL for build verification
        run: |
          cd frontend
          npm run build